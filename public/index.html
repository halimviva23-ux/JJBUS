<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>전주 버스 도착 정보</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --surface2: #1a2235;
      --accent: #00d4ff;
      --accent2: #ff6b35;
      --green: #00e676;
      --yellow: #ffd600;
      --red: #ff1744;
      --text: #e8eaf6;
      --muted: #607d8b;
      --border: rgba(0, 212, 255, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }
    .container { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 0 80px; }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0d1b2e 0%, #1a2940 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 20px 16px;
      position: sticky; top: 0; z-index: 100;
    }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .stop-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,212,255,0.1); border: 1px solid var(--accent);
      color: var(--accent); font-family: 'Space Mono', monospace;
      font-size: 11px; padding: 4px 10px; border-radius: 4px; letter-spacing: 0.05em;
    }
    .stop-badge::before {
      content: ''; width: 6px; height: 6px;
      background: var(--accent); border-radius: 50%;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }
    .stop-name { font-size: 22px; font-weight: 900; color: #fff; line-height: 1.2; }
    .stop-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .refresh-btn {
      background: rgba(0,212,255,0.08); border: 1px solid var(--border);
      color: var(--accent); width: 38px; height: 38px; border-radius: 8px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 18px; transition: all 0.2s; flex-shrink: 0;
    }
    .refresh-btn:active { transform: scale(0.9); }
    .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .time-bar { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; }
    .time-bar span:last-child { color: var(--green); }

    /* Section */
    .section-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); padding: 16px 20px 8px; font-family: 'Space Mono', monospace; }

    /* Bus Card */
    .bus-card {
      margin: 0 12px 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      transition: transform 0.15s, border-color 0.2s;
      animation: slideUp 0.4s ease both;
    }
    .bus-card:active { transform: scale(0.98); }
    @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .bus-card.urgent { border-color: rgba(255,23,68,0.4); }
    .bus-card.soon   { border-color: rgba(255,214,0,0.35); }
    .bus-card.normal { border-color: var(--border); }

    .bus-card-inner { display: grid; grid-template-columns: 64px 1fr auto; padding: 14px 16px; align-items: center; }
    .route-num { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .route-pill { font-weight: 900; font-size: 20px; color: #fff; line-height: 1; }
    .route-type { font-size: 9px; padding: 2px 6px; border-radius: 3px; font-weight: 700; letter-spacing: 0.05em; }
    .type-일반 { background: rgba(0,212,255,0.15); color: var(--accent); }
    .type-급행 { background: rgba(255,107,53,0.2); color: var(--accent2); }
    .type-마을 { background: rgba(0,230,118,0.15); color: var(--green); }
    .type-심야 { background: rgba(100,100,200,0.2); color: #9fa8da; }

    .route-info { padding: 0 12px; border-left: 1px solid rgba(255,255,255,0.05); margin-left: 4px; }
    .route-dest { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .route-via  { font-size: 11px; color: var(--muted); }

    .arrival { text-align: right; }
    .arrival-main { font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700; line-height: 1; }
    .urgent-time { color: var(--red); }
    .soon-time   { color: var(--yellow); }
    .normal-time { color: var(--accent); }
    .arrival-unit { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .arrival-next { font-size: 10px; color: var(--muted); margin-top: 4px; }

    .progress-bar { height: 2px; background: rgba(255,255,255,0.05); }
    .progress-fill { height: 100%; transition: width 1s linear; }
    .urgent-bar { background: var(--red); }
    .soon-bar   { background: var(--yellow); }
    .normal-bar { background: var(--accent); }

    /* State messages */
    .state-msg { text-align: center; padding: 40px 20px; color: var(--muted); }
    .state-msg .icon { font-size: 40px; display: block; margin-bottom: 12px; }
    .state-msg p { font-size: 13px; line-height: 1.7; }
    .state-msg a { color: var(--accent); text-decoration: none; }

    /* Skeleton */
    .skeleton { margin: 0 12px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
    .skel-line { background: var(--surface2); border-radius: 4px; margin-bottom: 8px; }

    /* Footer */
    .footer { text-align: center; padding: 20px; font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; }
    .footer a { color: var(--accent); text-decoration: none; }

    /* Countdown ring */
    .countdown-ring { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 10px; color: var(--muted); padding: 6px 20px 0; font-family: 'Space Mono', monospace; }
    .countdown-bar { flex: 1; height: 2px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
    .countdown-fill { height: 100%; background: var(--accent); transition: width 1s linear; opacity: 0.5; }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="stop-badge" id="stopBadge">LIVE</div>
        <div class="stop-name" id="stopName">로딩 중...</div>
        <div class="stop-sub" id="stopSub">전북특별자치도 전주시</div>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="loadBusData()" title="새로고침">
        <svg id="refreshIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </div>
    <div class="time-bar">
      <span id="currentTime">--:--:--</span>
      <span id="updateStatus">연결 중...</span>
    </div>
    <div class="countdown-ring">
      <span id="countdownText">30초 후 갱신</span>
      <div class="countdown-bar"><div class="countdown-fill" id="countdownFill" style="width:100%"></div></div>
    </div>
  </div>

  <div id="sectionLabel" class="section-label" style="display:none">실시간 도착 정보</div>
  <div id="busList"></div>

  <div class="footer">
    데이터 제공: <a href="https://www.data.go.kr" target="_blank">공공데이터포털</a> · 전북특별자치도 전주시<br>
    30초마다 자동 갱신 · 정보는 변동될 수 있습니다
  </div>
</div>

<script>
  // URL 파라미터에서 정류장 정보 읽기
  const params = new URLSearchParams(window.location.search);
  const STATION_ID   = params.get('station') || params.get('id') || '';
  const STATION_NAME = params.get('name') || '정류장';

  let countdown = 30;
  let countdownTimer = null;

  // ── 초기화 ──────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    updateClock();
    setInterval(updateClock, 1000);

    if (!STATION_ID) {
      showNoStation();
      return;
    }

    document.getElementById('stopBadge').textContent = STATION_ID;
    document.getElementById('stopName').textContent  = STATION_NAME;

    loadBusData();
    setInterval(loadBusData, 30000);
    startCountdown();
  });

  // ── 시계 ────────────────────────────
  function updateClock() {
    const n = new Date();
    document.getElementById('currentTime').textContent =
      `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
  }

  // ── 카운트다운 ───────────────────────
  function startCountdown() {
    countdown = 30;
    clearInterval(countdownTimer);
    countdownTimer = setInterval(() => {
      countdown--;
      const pct = (countdown / 30) * 100;
      document.getElementById('countdownFill').style.width = pct + '%';
      document.getElementById('countdownText').textContent = countdown > 0 ? `${countdown}초 후 갱신` : '갱신 중...';
      if (countdown <= 0) { countdown = 30; }
    }, 1000);
  }

  // ── 데이터 로드 ──────────────────────
  async function loadBusData() {
    setRefreshing(true);
    showSkeleton();
    startCountdown();

    try {
      // /api/bus 는 Vercel 서버리스 함수 (api/bus.js) 로 프록시됨
      const res = await fetch(`/api/bus?stationId=${encodeURIComponent(STATION_ID)}`);
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

      const header = data?.response?.header;
      if (header?.resultCode !== '00') throw new Error(header?.resultMsg || 'API 오류');

      const raw   = data?.response?.body?.items?.item || [];
      const buses = Array.isArray(raw) ? raw : [raw];

      renderBusList(buses);
      document.getElementById('updateStatus').textContent = '방금 갱신됨';

    } catch (err) {
      showError(err.message);
      document.getElementById('updateStatus').textContent = '오류 발생';
    } finally {
      setRefreshing(false);
    }
  }

  // ── 렌더링 ───────────────────────────
  function renderBusList(buses) {
    const list  = document.getElementById('busList');
    const label = document.getElementById('sectionLabel');

    if (!buses || buses.length === 0) {
      label.style.display = 'none';
      list.innerHTML = `<div class="state-msg"><span class="icon">🌙</span><p>현재 도착 예정 버스가 없습니다.<br>운행 종료 또는 잠시 후 다시 확인해주세요.</p></div>`;
      return;
    }

    buses.sort((a, b) => (parseInt(a.arrtime)||9999) - (parseInt(b.arrtime)||9999));
    label.style.display = 'block';

    list.innerHTML = buses.map((b, i) => {
      const secs = parseInt(b.arrtime) || 0;
      const mins = Math.round(secs / 60);
      const urgency  = secs <= 60 ? 'urgent' : secs <= 180 ? 'soon' : 'normal';

      let timeDisplay, timeUnit;
      if (secs <= 60)       { timeDisplay = '곧';  timeUnit = '도착'; }
      else if (secs < 3600) { timeDisplay = mins;  timeUnit = '분 후'; }
      else                  { timeDisplay = `${Math.floor(secs/3600)}h`; timeUnit = '이상'; }

      const nextSecs = parseInt(b.arrtime2) || 0;
      const nextMins = nextSecs > 60 ? Math.round(nextSecs/60) : null;
      const pct = Math.max(5, Math.min(100, 100 - (secs/1200*100)));
      const routeType = b.routetp || '일반';

      return `
        <div class="bus-card ${urgency}" style="animation-delay:${i*0.07}s">
          <div class="bus-card-inner">
            <div class="route-num">
              <div class="route-pill">${b.routeno || '?'}</div>
              <div class="route-type type-${routeType}">${routeType}</div>
            </div>
            <div class="route-info">
              <div class="route-dest">→ ${b.nodenm || '종점'}</div>
              <div class="route-via">${b.nodeno ? `정류소 ${b.nodeno}번` : ''}
                ${b.lowplate == 1 ? '<span style="font-size:9px;background:rgba(0,230,118,0.1);color:#00e676;padding:1px 5px;border-radius:3px;margin-left:4px;font-weight:700">저상</span>' : ''}
              </div>
            </div>
            <div class="arrival">
              <div class="arrival-main ${urgency}-time">${timeDisplay}</div>
              <div class="arrival-unit">${timeUnit}</div>
              ${nextMins ? `<div class="arrival-next">다음 ${nextMins}분</div>` : ''}
            </div>
          </div>
          <div class="progress-bar"><div class="progress-fill ${urgency}-bar" style="width:${pct}%"></div></div>
        </div>`;
    }).join('');
  }

  function showSkeleton() {
    document.getElementById('sectionLabel').style.display = 'none';
    document.getElementById('busList').innerHTML = [1,2,3].map(() =>
      `<div class="skeleton"><div class="skel-line" style="width:60%;height:14px"></div><div class="skel-line" style="width:40%;height:10px;margin-top:6px"></div></div>`
    ).join('');
  }

  function showNoStation() {
    document.getElementById('stopName').textContent = '정류장 미지정';
    document.getElementById('sectionLabel').style.display = 'none';
    document.getElementById('busList').innerHTML = `
      <div class="state-msg">
        <span class="icon">📍</span>
        <p>URL에 정류장 정보가 없습니다.<br>
        QR 코드 URL에 아래 파라미터를 추가해주세요:<br><br>
        <code style="color:var(--yellow);font-size:12px">?station=정류장ID&name=정류장명</code></p>
      </div>`;
    document.getElementById('updateStatus').textContent = '정류장 미설정';
  }

  function showError(msg) {
    document.getElementById('sectionLabel').style.display = 'none';
    document.getElementById('busList').innerHTML = `
      <div class="state-msg">
        <span class="icon">⚠️</span>
        <p>데이터를 불러오지 못했습니다.<br><small style="color:var(--muted)">${msg}</small></p>
      </div>`;
  }

  function setRefreshing(on) {
    document.getElementById('refreshBtn').classList.toggle('spinning', on);
  }
</script>
</body>
</html>
